<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickInvoice</title>
    <meta name="description" content="A simple invoicing app for small sellers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/print.css" media="print" />
  </head>
  <body>
    <div class="sidebar-overlay no-print" id="sidebar-overlay"></div>
    <div class="app-shell">
      <aside class="sidebar no-print" id="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <span class="brand-name">QuickInvoice</span>
        </div>
        <nav aria-label="Primary">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="#/dashboard" data-route="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="9" rx="1.5" />
                  <rect x="14" y="3" width="7" height="5" rx="1.5" />
                  <rect x="14" y="12" width="7" height="9" rx="1.5" />
                  <rect x="3" y="16" width="7" height="5" rx="1.5" />
                </svg>
                Dashboard
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/customers" data-route="customers">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
                  <circle cx="10" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                Customers
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/invoices" data-route="invoices">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <path d="M14 2v6h6" />
                  <path d="M9 13h6M9 17h6M9 9h1" />
                </svg>
                Invoices
              </a>
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a class="btn btn-primary" href="#/invoices/new">+ New Invoice</a>
        </div>
      </aside>

      <div class="main-area">
        <header class="topbar no-print">
          <div class="topbar-left">
            <button
              class="btn-icon mobile-menu-btn"
              id="mobile-menu-btn"
              aria-label="Open navigation"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18" />
              </svg>
            </button>
            <h1 class="topbar-title" id="page-title">Dashboard</h1>
          </div>
          <div class="user-chip">
            <div class="avatar" aria-hidden="true">SS</div>
            <span class="user-name">Small Seller</span>
          </div>
        </header>

        <main class="page-content" id="page-content"></main>
      </div>
    </div>

    <div class="toast-container no-print" id="toast-container" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/format.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/views-registry.js"></script>
    <script src="/js/views/dashboard.js"></script>
    <script src="/js/views/customers.js"></script>
    <script src="/js/views/invoices.js"></script>
    <script src="/js/views/invoiceCreate.js"></script>
    <script src="/js/views/invoiceDetail.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
